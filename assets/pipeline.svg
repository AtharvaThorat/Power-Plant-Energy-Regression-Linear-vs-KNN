<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Pipeline: data feeds a linear family (one predictor, multiple regression, nonlinear terms, backward elimination) and KNN regression; all are evaluated on a 70/30 holdout and 5x2 cross-validation, with gradient boosting as a reference" xmlns:c2pa="http://c2pa.org/manifest">
<defs><style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flow,.back{stroke-dasharray:6 5;animation:f .9s linear infinite}@keyframes f{to{stroke-dashoffset:-11}}</style><marker id="m00a888" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#00a888"/></marker><marker id="me76624" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e76624"/></marker><marker id="m338ced" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#338ced"/></marker><marker id="md28e05" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d28e05"/></marker></defs>
<rect width="1200" height="440" rx="18" fill="#0d1117"/><rect x="40" y="170" width="170" height="92" rx="10" fill="#11161d" stroke="#30363d" stroke-opacity=".85"/><text x="125.0" y="196" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3">UCI CCPP</text><text x="125.0" y="216" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">9,568 hours</text><text x="125.0" y="232" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">AT · V · AP · RH</text><text x="125.0" y="248" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">→ PE (MW)</text><text x="270" y="42" class="sans" font-size="15" font-weight="700" fill="#338ced">Linear family</text><rect x="270" y="58" width="180" height="80" rx="10" fill="#11161d" stroke="#338ced" stroke-opacity=".85"/><text x="360.0" y="84" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3">one predictor</text><text x="360.0" y="104" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">OLS × 4</text><text x="360.0" y="120" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">outliers |t| > 3</text><rect x="480" y="58" width="170" height="80" rx="10" fill="#11161d" stroke="#338ced" stroke-opacity=".85"/><text x="565.0" y="84" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3">all four</text><text x="565.0" y="104" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">multiple OLS</text><text x="565.0" y="120" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">R² = 0.929</text><rect x="680" y="58" width="200" height="80" rx="10" fill="#11161d" stroke="#338ced" stroke-opacity=".85"/><text x="780.0" y="84" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3">+ nonlinearity</text><text x="780.0" y="104" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">cubic terms</text><text x="780.0" y="120" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">6 pairwise interactions</text><rect x="910" y="58" width="250" height="80" rx="10" fill="#11161d" stroke="#338ced" stroke-opacity=".85"/><text x="1035.0" y="84" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3">backward elimination</text><text x="1035.0" y="104" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">14 terms → 11, p ≤ 0.05</text><text x="1035.0" y="120" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">hierarchy respected</text><text x="270" y="300" class="sans" font-size="15" font-weight="700" fill="#e76624">Nearest neighbours</text><rect x="270" y="316" width="250" height="80" rx="10" fill="#11161d" stroke="#e76624" stroke-opacity=".85"/><text x="395.0" y="342" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3">KNN regression</text><text x="395.0" y="362" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">k = 1 … 100</text><text x="395.0" y="378" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">raw vs. min-max scaled</text><rect x="910" y="200" width="250" height="100" rx="10" fill="#11161d" stroke="#00a888" stroke-opacity=".85"/><text x="1035.0" y="226" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3">evaluation</text><text x="1035.0" y="246" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">70 / 30 holdout (original)</text><text x="1035.0" y="262" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">5 × 2-fold CV, k tuned</text><text x="1035.0" y="278" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">inside each training half</text><rect x="560" y="316" width="320" height="80" rx="10" fill="#11161d" stroke="#30363d" stroke-opacity=".85"/><text x="720.0" y="342" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3">reference</text><text x="720.0" y="362" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">gradient boosting, defaults</text><text x="720.0" y="378" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">where a stronger model lands</text><path d="M210,216 H240 V98 H264" stroke="#338ced" stroke-width="2" fill="none" class="flow" marker-end="url(#m338ced)"/><path d="M210,216 H240 V356 H264" stroke="#e76624" stroke-width="2" fill="none" class="flow" marker-end="url(#me76624)"/><path d="M452,98 H474" stroke="#338ced" stroke-width="2" fill="none" class="flow" marker-end="url(#m338ced)"/><path d="M652,98 H674" stroke="#338ced" stroke-width="2" fill="none" class="flow" marker-end="url(#m338ced)"/><path d="M882,98 H904" stroke="#338ced" stroke-width="2" fill="none" class="flow" marker-end="url(#m338ced)"/><path d="M1035,138 V194" stroke="#00a888" stroke-width="2" fill="none" class="flow" marker-end="url(#m00a888)"/><path d="M880,356 H1035 V306" stroke="#00a888" stroke-width="2" fill="none" class="flow" marker-end="url(#m00a888)"/><path d="M520,340 H540 V300 H904" stroke="#e76624" stroke-width="2" fill="none" class="flow" marker-end="url(#me76624)"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>